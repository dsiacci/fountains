[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fountains"
version = "0.1.0"
description = "Score the drinking-water fountains along a GPX ride: will they be running on the day you ride?"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "numpy>=1.24",
  "tabpfn>=9.1,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fountains = "fountains.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fountains = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
