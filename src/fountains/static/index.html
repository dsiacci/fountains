<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fountains</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 14 18%22%3E%3Cpath d=%22M7 1C7 1 1.5 7.6 1.5 11.3a5.5 5.5 0 0 0 11 0C12.5 7.6 7 1 7 1Z%22 fill=%22%231F6FA8%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<style>
:root {
  --bg: #F5F6F3; --surface: #FFFFFF; --ink: #15201B; --muted: #5C6964; --line: #E1E5DF; --soft: #EEF1EC; --chip: #D5DBD3;
  --accent: #1F6FA8; --accent-ink: #FFFFFF; --accent-soft: #E5F0F8; --likely: #22744C; --uncertain: #8F5E07; --unlikely: #A3441C;
  --not: #6F7873; --unsure: #9A6406; --box: #FF5A1F; --warn-bg: #FFF6E0; --warn-line: #EBD8A6; --warn-ink: #4A3B12;
  --dry-a: #F4DFB8; --dry-b: #FBEFD8; --dry-line: #E2C27F; --dry-ink: #6B4A07; --shadow: 0 2px 10px rgba(21, 32, 27, .14);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412; --surface: #181D1B; --ink: #E6EBE8; --muted: #9BA8A2; --line: #2B3330; --soft: #222926; --chip: #39433F;
    --accent: #5FB0DE; --accent-ink: #0B1A24; --accent-soft: #17303F; --likely: #5CBC8E; --uncertain: #DFB35B; --unlikely: #E58C66;
    --not: #8D9591; --unsure: #E0B25A; --box: #FF7A45; --warn-bg: #2B2414; --warn-line: #6D5A2A; --warn-ink: #F2D98F;
    --dry-a: #4A3A17; --dry-b: #3A2E14; --dry-line: #7A6229; --dry-ink: #F2D98F; --shadow: 0 2px 10px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
a { color: var(--accent); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: 60px minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }

/* header and steps */
.top { display: flex; align-items: center; gap: 20px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; letter-spacing: -.01em; color: var(--ink); text-decoration: none; width: 190px; flex: 0 0 auto; }
.steps { flex: 1; display: flex; justify-content: center; min-width: 0; }
.steps ol { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 650; }
.steps .sep { width: 26px; height: 1px; background: var(--chip); }
.steps a { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; color: var(--muted); text-decoration: none; white-space: nowrap; }
.steps a .n { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--chip); font-size: 12px; font-weight: 800; }
.steps a.done .n { border: 0; background: var(--accent-soft); color: var(--accent); }
.steps a[aria-current="step"] { background: var(--ink); color: var(--bg); }
.steps a[aria-current="step"] .n { border: 0; background: var(--bg); color: var(--ink); }
.steps a[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.steps .count { font-weight: 500; opacity: .75; font-variant-numeric: tabular-nums; }
.ridechip { width: 190px; flex: 0 0 auto; display: flex; justify-content: flex-end; }
.ridechip span { font-size: 13px; font-weight: 600; color: var(--muted); padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
main { position: relative; min-height: 0; }
.screen { position: absolute; inset: 0; display: none; }
.screen.on { display: flex; }
footer.warn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 7px 16px; background: var(--warn-bg); border-top: 1px solid var(--warn-line); color: var(--warn-ink); font-size: 13px; font-weight: 600; text-align: center; }

/* shared bits */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--chip); background: var(--surface); font-size: 14px; font-weight: 700; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[disabled] { opacity: .5; cursor: default; }
.sw { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 2px; border: 0; background: transparent; font-size: 13px; font-weight: 650; color: var(--muted); white-space: nowrap; }
.sw .track { width: 34px; height: 20px; border-radius: 999px; background: var(--chip); position: relative; flex: 0 0 auto; transition: background .15s; }
.sw .track::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw[aria-checked="true"] { color: var(--ink); }
.sw[aria-checked="true"] .track { background: var(--accent); }
.sw[aria-checked="true"] .track::after { left: 17px; }
.sw[disabled] { opacity: .5; cursor: default; }
.band { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 800; white-space: nowrap; }
.band.likely { background: var(--likely); } .band.uncertain { background: var(--uncertain); } .band.unlikely { background: var(--unlikely); } .band.sure { background: var(--accent); color: var(--accent-ink); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.err { color: var(--unlikely); font-weight: 650; }

/* 1. ride */
#screen-ride { overflow: auto; justify-content: center; }
.ridebox { width: 100%; max-width: 640px; padding: 48px 20px; display: flex; flex-direction: column; gap: 18px; }
.ridebox h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; }
.drop { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 220px; border-radius: 18px; border: 2px dashed var(--chip); background: var(--surface); cursor: pointer; text-align: center; padding: 20px; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop .icon { width: 56px; height: 56px; border-radius: 16px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
.drop strong { font-size: 20px; }
.recent { display: flex; flex-direction: column; gap: 8px; }
.recent button { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
.recent button[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.recent .t { flex: 1; display: flex; flex-direction: column; gap: 2px; }

/* 2. check */
#screen-check { min-height: 0; }
.mapwrap { flex: 1 1 auto; position: relative; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--soft); }
.floating { position: absolute; z-index: 500; background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); }
.layers { left: 14px; top: 14px; display: flex; gap: 2px; padding: 3px; }
.layers button { min-height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; font-size: 13px; font-weight: 650; }
.layers button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.listbtn { right: 14px; top: 14px; display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 14px; border: 0; font-size: 13px; font-weight: 700; }
.legend { left: 14px; bottom: 22px; display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px; font-size: 12px; font-weight: 650; color: var(--muted); max-width: calc(100% - 90px); }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.jobchip { left: 14px; top: 62px; padding: 8px 12px; font-size: 12px; font-weight: 650; max-width: 360px; }
.drawer { position: absolute; z-index: 600; top: 62px; right: 14px; bottom: 14px; width: 330px; display: flex; flex-direction: column; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.drawer .filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px; border-bottom: 1px solid var(--line); }
.drawer .filters button { min-height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 650; }
.drawer .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.drawer ol { list-style: none; margin: 0; padding: 6px; overflow: auto; }
.drawer li button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
.drawer li button:hover { background: var(--soft); }
.drawer li button[aria-current="true"] { background: var(--accent-soft); }
.drawer .km { width: 42px; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.drawer .nm { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
.dot.todo { background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink); } .dot.fountain { background: var(--accent); } .dot.not { background: var(--not); opacity: .7; } .dot.unsure { background: var(--unsure); }
.panel { flex: 0 0 520px; width: 520px; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 24px; background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; }
.phead { display: flex; align-items: center; gap: 10px; }
.kmpill { padding: 4px 9px; border-radius: 8px; background: var(--soft); font-size: 13px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
.phead h1 { margin: 0; flex: 1; font-size: 21px; letter-spacing: -.015em; line-height: 1.2; min-width: 0; overflow-wrap: anywhere; }
.iconbtn { width: 36px; height: 36px; flex: 0 0 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid var(--chip); background: var(--surface); padding: 0; }
.sub { margin: -8px 0 0; font-size: 13px; color: var(--muted); }
.viewer { position: relative; width: 100%; aspect-ratio: 1600 / 672; border-radius: 12px; overflow: hidden; background: var(--soft); flex: 0 0 auto; }
.viewer img.crop { display: block; width: 100%; height: 100%; object-fit: cover; }
.viewer .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; color: var(--muted); font-size: 14px; }
.box { position: absolute; border: 2px solid var(--box); border-radius: 4px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .45); pointer-events: none; }
.box.weak { border-style: dashed; box-shadow: none; }
.boxlabel { position: absolute; transform: translateY(-100%); margin-top: -3px; padding: 1px 6px; border-radius: 6px; background: var(--box); color: #15201B; font-size: 11px; font-weight: 800; white-space: nowrap; pointer-events: none; }
.boxlabel.weak { background: rgba(255, 255, 255, .92); }
.boxlabel.end { transform: translate(-100%, -100%); }
.vbtn { position: absolute; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; color: #fff; background: rgba(21, 32, 27, .78); font-size: 12px; font-weight: 700; }
.vbtn.look { right: 10px; top: 10px; min-height: 32px; padding: 0 11px; border-radius: 999px; }
.vbtn.prev, .vbtn.next { top: 50%; width: 36px; height: 36px; margin-top: -18px; border-radius: 50%; }
.vbtn.prev { left: 8px; } .vbtn.next { right: 8px; }
.vcount { position: absolute; left: 10px; bottom: 10px; padding: 3px 8px; border-radius: 999px; background: rgba(21, 32, 27, .78); color: #fff; font-size: 12px; font-weight: 600; pointer-events: none; }
.pano { position: absolute; inset: 0; background-color: #1B1F1D; background-repeat: repeat-x; cursor: grab; touch-action: none; overflow: hidden; }
.pano.drag { cursor: grabbing; }
.pano .tag { position: absolute; top: 8px; transform: translateX(-50%); padding: 2px 7px; border-radius: 6px; background: #fff; color: #15201B; font-size: 11px; font-weight: 800; white-space: nowrap; pointer-events: none; }
.pano .tagline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed rgba(255, 255, 255, .85); pointer-events: none; }
.pano .compass { position: absolute; bottom: 6px; transform: translateX(-50%); color: #fff; font-size: 11px; font-weight: 800; text-shadow: 0 1px 2px #000; pointer-events: none; }
.pano .zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.pano .zoom button { width: 32px; height: 32px; border-radius: 8px; border: 0; background: rgba(255, 255, 255, .92); color: #15201B; font-size: 17px; font-weight: 800; }
.pano .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; padding: 16px; text-align: center; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; flex: 0 0 auto; scrollbar-width: thin; }
.strip button { position: relative; flex: 0 0 72px; width: 72px; height: 44px; padding: 0; border-radius: 9px; overflow: hidden; border: 2.5px solid transparent; background: var(--soft); }
.strip button[aria-pressed="true"] { border-color: var(--accent); }
.strip img { display: block; width: 100%; height: 100%; object-fit: cover; }
.strip .sc { position: absolute; right: 3px; bottom: 3px; padding: 0 4px; border-radius: 5px; background: rgba(255, 255, 255, .92); color: #15201B; font-size: 10px; font-weight: 800; }
.strip .sc.hi { background: var(--box); }
.strip .star { position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; }
.hint { margin: -6px 0 0; font-size: 12px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.choose { border: 1.5px solid var(--accent); color: var(--accent); }
.choose[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.verdict { display: flex; gap: 10px; margin-top: auto; padding-top: 4px; }
.verdict button { flex: 1; min-height: 52px; border-radius: 12px; border: 1.5px solid var(--chip); background: var(--surface); font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
.verdict kbd { font: inherit; font-size: 11px; opacity: .65; }
.verdict button[aria-pressed="true"][data-v="fountain"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.verdict button[aria-pressed="true"][data-v="not"] { background: var(--not); border-color: var(--not); color: #fff; }
.verdict button[aria-pressed="true"][data-v="unsure"] { background: var(--unsure); border-color: var(--unsure); color: #fff; }
.verdict.pre button[aria-pressed="true"] { opacity: .78; }
.nextlink { font-size: 13px; font-weight: 750; text-decoration: none; background: none; border: 0; color: var(--accent); padding: 4px 0; }
.keys { font-size: 12px; color: var(--muted); }
.keys kbd { font: inherit; font-size: 11px; font-weight: 700; padding: 0 5px; border: 1px solid var(--chip); border-radius: 4px; }

/* 3. score */
#screen-score { overflow: auto; flex-direction: column; gap: 16px; padding: 18px 24px; }
.settings { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 14px; }
.settings label { display: grid; gap: 3px; font-size: 12px; font-weight: 650; color: var(--muted); }
.settings input { min-height: 40px; border: 1px solid var(--chip); border-radius: 10px; padding: 0 10px; background: var(--surface); font-weight: 650; }
.settings input[type="number"] { width: 84px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.ribbon { padding: 16px 20px 10px; }
.ribbon .bar { position: relative; height: 84px; }
.ribbon .water { position: absolute; left: 0; right: 0; top: 40px; height: 8px; border-radius: 4px; background: var(--accent-soft); }
.ribbon .dry { position: absolute; top: 36px; height: 16px; border-radius: 5px; background: repeating-linear-gradient(135deg, var(--dry-a) 0 6px, var(--dry-b) 6px 12px); border: 1px solid var(--dry-line); }
.ribbon .drylab { position: absolute; top: 6px; font-size: 12px; font-weight: 750; color: var(--dry-ink); white-space: nowrap; transform: translateX(-50%); }
.ribbon .f { position: absolute; top: 34px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); padding: 0; }
.ribbon .s { position: absolute; top: 62px; width: 20px; height: 20px; margin-left: -10px; border-radius: 6px; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; }
.ribbon .ticks { position: relative; height: 18px; font-size: 11px; font-weight: 650; color: var(--muted); font-variant-numeric: tabular-nums; }
.ribbon .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.cols { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.flist { flex: 999 1 540px; min-width: 0; padding: 6px 0 12px; }
.flist h2, .stretches h2 { margin: 10px 20px 6px; font-size: 15px; }
.frow { border-top: 1px solid var(--soft); }
.frow .line { display: flex; align-items: center; gap: 12px; padding: 9px 20px; }
.frow .when { width: 124px; flex: 0 0 auto; font-size: 13px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
.frow .what { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 4px 0; font-size: 14px; font-weight: 700; }
.frow .what span { font-weight: 500; color: var(--muted); }
.frow.open { background: var(--accent-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 12px 156px; }
.chips span { padding: 4px 9px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; font-weight: 600; }
.stretches { flex: 1 1 360px; min-width: 0; padding: 6px 0 14px; }
.stretches .head { display: flex; align-items: center; gap: 10px; padding-right: 16px; }
.stretches .head h2 { flex: 1; }
.gap { padding: 6px 20px 8px; }
.gap h3 { margin: 6px 0 8px; font-size: 13px; color: var(--dry-ink); }
.stop { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: var(--bg); margin-bottom: 6px; font-size: 14px; }
.stop .k { width: 56px; flex: 0 0 auto; font-size: 13px; font-weight: 750; font-variant-numeric: tabular-nums; }
.stop .n { flex: 1; min-width: 0; font-weight: 700; display: flex; flex-direction: column; }
.stop .n small { font-size: 12px; font-weight: 500; color: var(--muted); }
.stop .st { font-size: 13px; font-weight: 750; white-space: nowrap; }
.st.open { color: var(--likely); } .st.closed { color: var(--unlikely); } .st.unknown { color: var(--muted); }
.stop .sug { color: var(--accent); }
details.more summary { cursor: pointer; font-size: 13px; font-weight: 650; color: var(--muted); padding: 4px 0 8px; }
.note { margin: 0 20px; font-size: 12px; color: var(--muted); }

/* 4. gpx */
#screen-gpx { overflow: auto; justify-content: center; }
.gpxbox { width: 100%; max-width: 720px; padding: 40px 20px; display: flex; flex-direction: column; gap: 18px; }
.gpxbox h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.tile b { display: block; font-size: 26px; letter-spacing: -.02em; }
.wpts { list-style: none; margin: 0; padding: 6px 0; }
.wpts li { display: flex; gap: 12px; align-items: center; padding: 7px 16px; border-top: 1px solid var(--soft); font-size: 14px; }
.wpts li:first-child { border-top: 0; }
.wpts .k { width: 56px; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.wpts code { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }

.leaflet-popup-content { margin: 10px 12px; }
.addform { display: grid; gap: 6px; min-width: 200px; }
.addform input { border: 1px solid #c9cec7; border-radius: 6px; padding: 6px 8px; color: #15201B; background: #fff; }
.addform button { border: 0; background: #1F6FA8; color: #fff; border-radius: 8px; padding: 8px; font-weight: 700; }

@media (max-width: 960px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100vh; grid-template-rows: auto 1fr auto; }
  .top { flex-wrap: wrap; gap: 8px; padding: 10px 14px; }
  .brand { width: auto; }
  .ridechip { width: auto; flex: 1 1 0; min-width: 0; }
  .steps { order: 3; flex-basis: 100%; overflow-x: auto; justify-content: flex-start; }
  .steps .sep { width: 12px; }
  main { min-height: 70vh; }
  .screen { position: static; }
  #screen-check { flex-direction: column; }
  .mapwrap { flex: 0 0 auto; height: 44vh; }
  .panel { flex: 1 1 auto; width: auto; border-left: 0; border-top: 1px solid var(--line); padding: 16px; }
  .drawer { top: 56px; width: auto; left: 14px; }
  .chips { padding-left: 20px; }
  .frow .when { width: 96px; }
  .frow .line { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#ride">
      <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 1C7 1 1.5 7.6 1.5 11.3a5.5 5.5 0 0 0 11 0C12.5 7.6 7 1 7 1Z" fill="var(--accent)"/></svg>
      <span>fountains</span>
    </a>
    <nav class="steps" aria-label="Steps"><ol id="steps"></ol></nav>
    <div class="ridechip" id="ridechip"></div>
  </header>

  <main>
    <section class="screen" id="screen-ride" aria-label="Your ride">
      <div class="ridebox">
        <h1>Your ride</h1>
        <label class="drop" id="drop">
          <input type="file" id="file" accept=".gpx,application/gpx+xml">
          <span class="icon"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-5 5m5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <strong id="droptitle">Choose a GPX</strong>
          <span class="muted">or drop it here. It stays on this computer.</span>
        </label>
        <p class="err" id="uperr" role="alert" hidden></p>
        <div id="recentbox" hidden>
          <h2 class="small muted" style="margin:6px 0 8px">On this computer</h2>
          <div class="recent" id="recent"></div>
        </div>
      </div>
    </section>

    <section class="screen" id="screen-check" aria-label="Check the water points">
      <div class="mapwrap">
        <div id="map" role="region" aria-label="Map of the ride and its water points"></div>
        <div class="floating layers" role="group" aria-label="Map background" id="layers">
          <button type="button" data-layer="plan" aria-pressed="true">Plan</button>
          <button type="button" data-layer="aerial" aria-pressed="false">Aerial</button>
          <button type="button" data-layer="osm" aria-pressed="false">OSM</button>
        </div>
        <button type="button" class="floating listbtn" id="listbtn" aria-expanded="false" aria-controls="drawer">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span id="listlabel">All points</span>
        </button>
        <div class="floating legend" aria-hidden="true">
          <span><i style="box-shadow:inset 0 0 0 2px var(--ink);background:var(--surface)"></i>To check</span>
          <span><i style="background:var(--accent)"></i>Fountain</span>
          <span><i style="background:var(--unsure)"></i>Not sure</span>
          <span><i style="background:var(--not)"></i>Not a fountain</span>
        </div>
        <div class="floating jobchip" id="jobchip" role="status" hidden></div>
        <div class="drawer" id="drawer" hidden>
          <div class="filters" role="group" aria-label="Show" id="filters"></div>
          <ol id="plist"></ol>
        </div>
      </div>
      <aside class="panel" id="panel"></aside>
    </section>

    <section class="screen" id="screen-score" aria-label="Score the fountains you kept"></section>
    <section class="screen" id="screen-gpx" aria-label="Take it on the ride"></section>
  </main>

  <footer class="warn">
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5 13 12.5H1L7 1.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7 5.5v3.2M7 10.4v.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span id="disclaimer">A score is never a reason to carry less water. Nothing here says the water is safe to drink.</span>
  </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const STEPS = [["ride", "Ride"], ["check", "Check"], ["score", "Score"], ["gpx", "GPX"]];

let S = null, version = null, timer = null;
const ui = { screen: "ride", sel: null, view: {}, look: false, drawer: false, filter: "all", expanded: null, openOnly: false, layer: "plan", lastCentered: null };
try { ui.openOnly = localStorage.getItem("fountains.openOnly") === "1"; } catch (e) { /* private window */ }

// ---- tiny DOM helpers: every child list is flattened and empty values dropped ----
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);

}
function put(el, kids, append) {

  const nodes = list.map((k) => (k instanceof Node ? k : document.createTextNode(String(k))));
  if (append) el.append(...nodes); else el.replaceChildren(...nodes);
}
function svg(markup, size = 16) {
  const t = document.createElement("template");
  t.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 16 16" aria-hidden="true">${markup}</svg>`;
  return t.content.firstChild;
}
const ICON = {
  left: '<path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>',
  right: '<path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>',
  check: '<path d="M3.5 8.3 6.6 11 12.5 4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  star: '<path d="m8 1.8 1.9 4 4.3.5-3.2 2.9.9 4.3L8 11.4l-3.9 2.1.9-4.3L1.8 6.3l4.3-.5L8 1.8Z" fill="currentColor"/>',
  eye: '<ellipse cx="8" cy="8" rx="6.5" ry="3.3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/>',
  fuel: '<path d="M3 4h6v9H3zM9 7h1.8v3.5a1.2 1.2 0 0 0 2.4 0V5.5L12 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>',
  shop: '<path d="M2 3h2l1.5 6.5h6l1.5-5H4.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="6.2" cy="12.5" r="1" fill="currentColor"/><circle cx="10.6" cy="12.5" r="1" fill="currentColor"/>',
  cup: '<path d="M3 5h8v4a4 4 0 0 1-8 0V5Zm8 1h1.5a1.8 1.8 0 0 1 0 3.6H11" fill="none" stroke="currentColor" stroke-width="1.3"/>',
};
const fmtDate = (iso) => (iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4) : "");
const wrap180 = (a) => ((a % 360) + 540) % 360 - 180;
const cap = (t) => t.replace(/^./, (c) => c.toUpperCase());
function distM(a, b, c, d) {
  const r = Math.PI / 180, x = (d - b) * r * Math.cos((a + c) / 2 * r), y = (c - a) * r;
  return Math.round(Math.hypot(x, y) * 6371008.8);
}
function bearing(a, b, c, d) {
  const r = Math.PI / 180, y = Math.sin((d - b) * r) * Math.cos(c * r);
  const x = Math.cos(a * r) * Math.sin(c * r) - Math.sin(a * r) * Math.cos(c * r) * Math.cos((d - b) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}

// ---- server -------------------------------------------------------------------
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function refresh(force) {
  try {
    const j = await api("/api/state" + (version !== null && !force ? "?v=" + version : ""));
    if (!j.same) apply(j);
  } catch (e) { /* the server may be restarting */ }
  schedule();
}
function schedule() {
  clearTimeout(timer);
  const running = S && S.ride && Object.values(S.ride.jobs || {}).some((j) => j.running);
  timer = setTimeout(refresh, running ? 2000 : 20000);
}
function apply(j) {
  const before = S && S.ride ? S.ride.id : null, after = j.ride ? j.ride.id : null;
  S = j;
  version = j.ride ? j.ride.version : null;
  if (before !== after) { ui.sel = null; ui.view = {}; ui.look = false; ui.expanded = null; ui.lastCentered = null; }
  render();
}
async function act(path, body) {
  try { apply(await api(path, body)); schedule(); return true; } catch (e) { toast(e.message); return false; }
}
function toast(msg) {
  const el = $("#jobchip");
  el.hidden = false; el.textContent = msg;
  clearTimeout(toast.t); toast.t = setTimeout(() => renderJob(), 5000);
}

// ---- routing --------------------------------------------------------------------
function go(screen, arg) { location.hash = "#" + screen + (arg ? "/" + arg : ""); }
function route() {
  const [scr, arg] = location.hash.slice(1).split("/");
  const has = S && S.ride;
  ui.screen = has && STEPS.some(([k]) => k === scr) ? scr : (has && !scr ? "check" : "ride");
  if (ui.screen === "check" && arg && arg !== ui.sel) { ui.sel = arg; ui.look = false; }
  render();
}
window.addEventListener("hashchange", route);

// ---- points ---------------------------------------------------------------------
const points = () => (S && S.ride ? [...S.ride.points].sort((a, b) => a.km - b.km) : []);
const checked = (p) => !!p.verdict && !p.prefilled;
const status = (p) => (p.verdict === "fountain" ? "fountain" : p.verdict === "not" ? "not" : p.verdict === "unsure" ? "unsure" : "todo");
function title(p) { return p.name || (p.origin === "clue" ? "Maybe a fountain" : cap(p.kind)); }
function current() {
  const list = points();
  return list.find((p) => p.id === ui.sel) || list.find((p) => !checked(p)) || list[0] || null;
}
function nextToCheck(p) {
  const list = points(), i = list.indexOf(p);
  return list.slice(i + 1).find((q) => !checked(q)) || list.slice(0, i).find((q) => !checked(q)) || null;
}
function sourceLine(p) {
  const bits = [];
  if (p.origin === "clue") bits.push("Clue: " + p.kind + (p.road ? " · " + p.road : ""));
  else if (p.origin === "you") bits.push("Added by you");
  else bits.push({ OSM: "OpenStreetMap", IGN: "IGN map point", "OSM + IGN": "OpenStreetMap and IGN" }[p.source] || p.source);
  bits.push(p.off_track_m + " m from your track");
  if (p.origin === "map" && p.road_m > 15) bits.push("mapped " + p.road_m + " m off the road");
  if (p.tags && p.tags.last_confirmed) bits.push("last checked " + fmtDate(p.tags.last_confirmed));
  if (p.tags && p.tags.seasonal) bits.push("seasonal: " + p.tags.seasonal);
  return bits.join(" · ");
}

// ---- render -----------------------------------------------------------------------
function render() {
  if (!S) return;
  $("#disclaimer").textContent = S.disclaimer;
  renderSteps();
  for (const [k] of STEPS) $("#screen-" + k).classList.toggle("on", ui.screen === k);
  if (ui.screen === "ride") renderRide();
  if (ui.screen === "check") renderCheck();
  if (ui.screen === "score") renderScore();
  if (ui.screen === "gpx") renderGpx();
}
function renderSteps() {
  const has = S.ride, list = points();
  const done = { ride: !!has, check: !!has && list.length > 0 && list.every(checked), score: !!has && !!has.score, gpx: false };
  const count = { check: has ? list.filter(checked).length + " / " + list.length : "" };
  const items = [];
  STEPS.forEach(([k, label], i) => {
    if (i) items.push(h("li", { class: "sep", "aria-hidden": "true" }));
    const cur = ui.screen === k;
    items.push(h("li", {}, h("a", { href: "#" + k, class: done[k] && !cur ? "done" : null, "aria-current": cur ? "step" : null,
      "aria-disabled": !has && k !== "ride" ? "true" : null },
      h("span", { class: "n" }, done[k] && !cur ? svg(ICON.check, 12) : String(i + 1)), label,
      count[k] ? h("span", { class: "count" }, count[k]) : null)));
  });
  put($("#steps"), items);
  put($("#ridechip"), has ? h("span", { title: has.name }, has.name + " · " + has.length_km + " km") : null);
}

// ---- 1. ride --------------------------------------------------------------------------
const drop = $("#drop");
async function upload(file) {
  $("#uperr").hidden = true;
  $("#droptitle").textContent = "Reading " + file.name + "…";
  try {
    const text = await file.text();
    apply(await api("/api/ride", { gpx: text, filename: file.name }));
    schedule();
    go("check");
  } catch (e) {
    $("#uperr").textContent = "This file could not be used: " + e.message;
    $("#uperr").hidden = false;
  }
  $("#droptitle").textContent = "Choose a GPX";
}
$("#file").addEventListener("change", (e) => e.target.files[0] && upload(e.target.files[0]));
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });
async function renderRide() {
  let rides = [];
  try { rides = (await api("/api/rides")).rides; } catch (e) { /* none */ }
  $("#recentbox").hidden = !rides.length;
  put($("#recent"), rides.map((r) => h("button", { type: "button", "aria-current": r.current ? "true" : null,
    onclick: async () => { if (await act("/api/open", { id: r.id })) go("check"); } },
    h("span", { class: "t" }, h("strong", {}, r.name), h("span", { class: "small muted" }, r.length_km + " km" + (r.climb_m ? " · " + r.climb_m + " m up" : "") + " · " + r.decided + " of " + r.points + " points checked")),
    svg(ICON.right, 18))));
}

// ---- 2. check: the map -------------------------------------------------------------------
let map = null, layers = {}, trackLayer = null, markers = {}, halo = null, camera = null, fittedRide = null;
function initMap() {
  if (map) return;
  const wmts = (layer, fmt) => "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=" + layer + "&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=" + fmt;
  layers = {
    plan: L.tileLayer(wmts("GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2", "image/png"), { maxZoom: 19, attribution: "Plan IGN" }),
    aerial: L.tileLayer(wmts("ORTHOIMAGERY.ORTHOPHOTOS", "image/jpeg"), { maxZoom: 19, attribution: "IGN BD ORTHO" }),
    osm: L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }),
  };
  map = L.map("map", { layers: [layers.plan], zoomControl: false });
  L.control.zoom({ position: "bottomright" }).addTo(map);
  map.on("click", (e) => addPopup(e.latlng));
  document.querySelectorAll("#layers button").forEach((b) => b.addEventListener("click", () => setLayer(b.dataset.layer)));
}
function setLayer(name) {
  ui.layer = name;
  for (const [k, l] of Object.entries(layers)) { if (k === name) l.addTo(map); else l.remove(); }
  document.querySelectorAll("#layers button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.layer === name)));
}
function markerStyle(p, selected) {
  const s = status(p);
  const fill = { fountain: css("--accent"), not: css("--not"), unsure: css("--unsure"), todo: css("--surface") }[s];
  return { radius: selected ? 10 : p.origin === "clue" ? 6 : 7, color: s === "todo" ? css("--ink") : "#fff", weight: 2.5,
    fillColor: fill, fillOpacity: s === "not" ? 0.55 : 1 };
}
function renderMap(p) {
  initMap();
  map.invalidateSize();
  const r = S.ride;
  if (fittedRide !== r.id) {
    if (trackLayer) trackLayer.remove();
    trackLayer = L.polyline(r.line, { color: css("--ink"), weight: 3.5, opacity: 0.8 }).addTo(map);
    for (const m of Object.values(markers)) m.remove();
    markers = {};
    map.fitBounds(trackLayer.getBounds().pad(0.04));
    fittedRide = r.id;
  }
  const ids = new Set();
  for (const q of r.points) {
    ids.add(q.id);
    const style = markerStyle(q, p && q.id === p.id);
    if (!markers[q.id]) {
      markers[q.id] = L.circleMarker([q.lat, q.lon], style).addTo(map)
        .on("click", (e) => { L.DomEvent.stopPropagation(e); go("check", q.id); })
        .bindTooltip(() => "km " + q.km.toFixed(1) + " · " + title(q), { direction: "top", offset: [0, -6] });
    } else markers[q.id].setStyle(style);
  }
  for (const [id, m] of Object.entries(markers)) if (!ids.has(id)) { m.remove(); delete markers[id]; }
  if (halo) { halo.remove(); halo = null; }
  if (p) {
    halo = L.circleMarker([p.lat, p.lon], { radius: 19, color: css("--accent"), weight: 3, fillColor: css("--accent"), fillOpacity: 0.15, interactive: false }).addTo(map);
    if (markers[p.id]) markers[p.id].bringToFront();
    if (ui.lastCentered !== p.id) {
      ui.lastCentered = p.id;
      if (!map.getBounds().pad(-0.15).contains([p.lat, p.lon]) || map.getZoom() < 15) map.flyTo([p.lat, p.lon], Math.max(map.getZoom(), 16), { duration: 0.6 });
    }
  }
  renderCamera(p);
}
function renderCamera(p) {
  if (camera) { camera.remove(); camera = null; }
  const c = p && shownPhoto(p);
  if (!c) return;
  const r = Math.PI / 180, len = 30 / 111195, heading = ui.look ? pano.yaw : c.heading;
  const tip = [c.lat + len * Math.cos(heading * r), c.lon + len * Math.sin(heading * r) / Math.cos(c.lat * r)];
  camera = L.layerGroup([
    L.polyline([[c.lat, c.lon], tip], { color: css("--box"), weight: 3, interactive: false }),
    L.circleMarker([c.lat, c.lon], { radius: 5, color: "#fff", weight: 2, fillColor: css("--box"), fillOpacity: 1, interactive: false }),
  ]).addTo(map);
}
function addPopup(latlng) {
  const name = h("input", { type: "text", placeholder: "Name (optional)", "aria-label": "Name of the fountain" });
  const err = h("p", { class: "small", style: "color:#A3441C;margin:0" });
  const form = h("form", { class: "addform", onsubmit: async (e) => {
    e.preventDefault();
    try { apply(await api("/api/add", { lat: latlng.lat, lon: latlng.lng, name: name.value })); map.closePopup(); }
    catch (x) { err.textContent = x.message; }
  } }, h("strong", {}, "A fountain you know here?"), name, h("button", { type: "submit" }, "Add it"), err);
  L.popup().setLatLng(latlng).setContent(form).openOn(map);
}

// ---- 2. check: the list drawer ----------------------------------------------------------------
const FILTERS = [["all", "All"], ["todo", "To check"], ["fountain", "Fountains"], ["unsure", "Not sure"], ["not", "Not fountains"]];
$("#listbtn").addEventListener("click", () => { ui.drawer = !ui.drawer; renderDrawer(current()); });
function renderDrawer(p) {
  const list = points();
  $("#listlabel").textContent = "All " + list.length + " points";
  $("#listbtn").setAttribute("aria-expanded", String(ui.drawer));
  $("#drawer").hidden = !ui.drawer;
  if (!ui.drawer) return;
  const keep = (q, k) => k === "all" || (k === "todo" ? !checked(q) : status(q) === k);
  put($("#filters"), FILTERS.map(([k, label]) => h("button", { type: "button", "aria-pressed": String(ui.filter === k),
    onclick: () => { ui.filter = k; renderDrawer(p); } }, label + " " + list.filter((q) => keep(q, k)).length)));
  put($("#plist"), list.filter((q) => keep(q, ui.filter)).map((q) => h("li", {}, h("button", { type: "button", "aria-current": p && q.id === p.id ? "true" : null,
    onclick: () => { ui.drawer = false; go("check", q.id); } },
    h("span", { class: "km" }, q.km.toFixed(1)), h("span", { class: "nm" }, title(q)),
    h("span", { class: "small muted" }, q.origin === "clue" ? "clue" : q.origin === "you" ? "you" : q.source),
    h("span", { class: "dot " + status(q), "aria-label": status(q) })))));
}

// ---- 2. check: the panel ------------------------------------------------------------------------
function viewIndex(p) {
  const n = (p.photos || []).length;
  if (!n) return 0;
  const i = ui.view[p.id] ?? p.chosen ?? 0;
  return Math.min(Math.max(0, i), n - 1);
}
function shownPhoto(p) { const ph = p.photos || []; return ph.length ? ph[viewIndex(p)] : null; }
function setView(p, i) {
  const n = (p.photos || []).length;
  if (!n) return;
  ui.view[p.id] = (i + n) % n;
  renderCheck(true);
}
function renderCheck(rebuild) {
  const p = current();
  if (p && ui.sel !== p.id) ui.sel = p.id;
  renderMap(p);
  renderDrawer(p);
  renderJob();
  const panel = $("#panel");
  if (!p) { put(panel, h("p", { class: "muted" }, "No water point near this ride yet. Click the map to add a fountain you know.")); return; }
  const sig = JSON.stringify([p.id, p.verdict, p.prefilled, p.sure, p.chosen, p.photo_state, (p.photos || []).length, p.ranked, viewIndex(p), ui.look]);
  if (!rebuild && panel.dataset.sig === sig) return;  // nothing visible changed: keep the panorama and the scroll position
  panel.dataset.sig = sig;
  const list = points(), idx = list.indexOf(p), next = nextToCheck(p);
  put(panel, [
    h("div", { class: "phead" },
      h("span", { class: "kmpill" }, "km " + p.km.toFixed(1)),
      h("h1", {}, title(p)),

  if (r.forecast_mm) out.push("forecast before the ride: " + Math.round(r.forecast_mm) + " mm");
  if (f.elevation_m != null) out.push(Math.round(f.elevation_m) + " m up");
  if (f.stream) out.push("stream " + (f.stream.stream || f.stream.station) + ", " + f.stream.km + " km away: " + (f.stream.flowing ? "flowing" : "not flowing") + " on " + fmtDate(f.stream.date));
  out.push(f.last_confirmed ? "last checked " + fmtDate(f.last_confirmed) : "no check date on the maps");
  out.push(f.detour_m != null ? f.detour_m + " m off the route" : "no mapped path to it");
  for (const n of f.notes || []) out.push(n);
  return out.map((t) => h("span", {}, t));
}
function bandsNote(m) {
  const cal = m.calibration || {}, pb = cal.per_band || {};
  const share = (b) => (pb[b] && pb[b].n ? Math.round(100 * pb[b].rate) + " % of " + pb[b].n.toLocaleString("en") : "no case");
  return "How to read the bands: on " + cal.n_stations + " Corsican streams each hidden from the model in turn, “likely” ones were flowing in " +
    share("likely") + " cases, “uncertain” in " + share("uncertain") + ", “unlikely” in " + share("unlikely") + ". " + S.note;
}

// ---- 4. gpx ----------------------------------------------------------------------------------------------------
async function renderGpx() {
  const scr = $("#screen-gpx");
  let w = [];
  try { w = (await api("/api/waypoints?open_only=" + (ui.openOnly ? "1" : "0"))).waypoints; } catch (e) { /* no ride */ }
  if (ui.screen !== "gpx") return;
  const n = (bands) => w.filter((x) => bands.includes(x.band)).length;
  const href = "/api/gpx?open_only=" + (ui.openOnly ? "1" : "0");
  put(scr, h("div", { class: "gpxbox" },
    h("h1", {}, "Take it on the ride"),
    h("div", { class: "tiles" },
      h("div", { class: "tile" }, h("b", {}, String(n(["sure", "likely", "uncertain", "unlikely", ""]))), "fountains you kept"),
      h("div", { class: "tile" }, h("b", {}, String(n(["check"]))), "points to check on the spot"),
      h("div", { class: "tile" }, h("b", {}, String(n(["stop"]))), ui.openOnly ? "places open when you pass" : "places suggested")),
    S.ride.score ? null : h("p", { class: "small muted", style: "margin:0" }, "Not scored yet: the fountains have no band. ", h("a", { href: "#score" }, "Score them first.")),
    w.length ? h("div", { class: "card" }, h("ol", { class: "wpts", "aria-label": "Waypoint names, as your bike computer will show them" },
      w.map((x) => h("li", {}, h("span", { class: "k" }, "km " + x.km.toFixed(1)), h("code", {}, x.name))))) : null,
    h("div", { class: "row" },
      h("a", { class: "btn primary", href, download: "" }, "Download the GPX"),
      h("span", { class: "small muted", style: "flex:1;min-width:240px" }, "Your track and these waypoints, in one file. Garmin: import it as a course in Garmin Connect, then send it to your device."))));
}

refresh(true).then(route);
</script>
